# Builds the site when its text changes. The editor on blog/ (the Cloud
# Function publishAnnouncement, functions/announcements.js) commits a new
# announcement as _src/posts/*.md plus its pictures in assets/img/posts/ and
# nothing else; this workflow runs `node tools/build.mjs`, which writes the
# page, the home page's cards, the feeds and the sitemap, and commits them.
# GitHub Pages then publishes main by itself (a minute or two).
#
# It is also a safety net for any change made on github.com in _src/ without
# running the build: the generated pages follow within minutes. A build that
# changes nothing commits nothing. Needs no secret: it only uses GITHUB_TOKEN,
# and its own commit touches no path listed below, so it cannot start itself.
name: publish
on:
  push:
    branches: [main]
    paths:
      - '_src/**'
      - 'assets/img/posts/**'
      - 'tools/build.mjs'
      - 'tools/markdown.mjs'
      - 'tools/components.mjs'
      - 'tools/conditions.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build
        run: node tools/build.mjs
      - name: Commit the pages
        run: |
          set -e
          if [ -z "$(git status --porcelain)" ]; then
            echo "the pages already match _src/."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build the pages from _src/'
          # somebody (or the editor) may have pushed meanwhile: take their
          # tip, build again on top of it, and push; three tries
          for i in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            node tools/build.mjs
            if [ -z "$(git status --porcelain)" ]; then echo "nothing left to build."; exit 0; fi
            git add -A
            git commit -m 'Build the pages from _src/'
          done
          echo "could not push after 3 tries" >&2
          exit 1
